# Named "backend" on purpose: the frontend image's nginx proxies /api/ to http://backend:3000.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: project1
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
