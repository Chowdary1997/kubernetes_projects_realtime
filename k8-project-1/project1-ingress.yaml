# Prefix: /api matches /api and anything under it (/api/, /api/users), not /apix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project1
  namespace: project1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - project1.example.com
      secretName: project1-tls
  rules:
    - host: project1.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project1
                port:
                  number: 80
