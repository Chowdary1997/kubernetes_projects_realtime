apiVersion: v1
kind: ConfigMap
metadata:
  name: project1-config
  namespace: project1
data:
  NODE_ENV: "production"
  PORT: "3000"
  PUBLIC_BASE_URL: "https://project1.example.com"
  POSTGRES_DB: "coming_soon"
  POSTGRES_USER: "coming_soon"
  DATABASE_SSL: "0"
  TRUST_PROXY: "1"
  DOUBLE_OPT_IN: "1"
  PRIVACY_POLICY_VERSION: "2026-10-01"
  LAUNCH_AT: "2026-12-01T09:00:00Z"
  SMTP_HOST: "smtp.example.com"        # replace with your SMTP provider
  SMTP_PORT: "587"
  SMTP_SECURE: "0"
  MAIL_FROM: "Project1 <no-reply@example.com>"
